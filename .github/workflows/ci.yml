name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/company-service
          - services/job-service
          - services/user-service
          - services/subscription-service
          - graphql-bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - name: Install shared deps
        run: cd shared && npm ci --ignore-scripts
      - name: Install service deps
        run: cd ${{ matrix.service }} && npm ci --ignore-scripts
      - name: Lint (if configured)
        run: cd ${{ matrix.service }} && npm run lint --if-present
      - name: Test (if configured)
        run: cd ${{ matrix.service }} && npm test --if-present

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - context: services/company-service
            image: company-service
          - context: services/job-service
            image: job-service
          - context: services/user-service
            image: user-service
          - context: services/subscription-service
            image: subscription-service
          - context: graphql-bff
            image: graphql-bff
          - context: react-fe
            image: react-fe
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ${{ matrix.image }}:${{ github.sha }} ${{ matrix.context }}

  integration:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build --wait
        timeout-minutes: 5
      - name: Health check BFF
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health && exit 0
            sleep 2
          done
          exit 1
      - name: Smoke test GraphQL
        run: |
          curl -sf http://localhost:4000/graphql \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ __typename }"}' | grep -q data
      - name: Tear down
        if: always()
        run: docker compose down -v

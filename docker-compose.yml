services:
  # ---------- Databases ----------
  company-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: company_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5441:5432"]
    volumes: [company-data:/var/lib/postgresql/data]

  job-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: job_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5442:5432"]
    volumes: [job-data:/var/lib/postgresql/data]

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5443:5432"]
    volumes: [user-data:/var/lib/postgresql/data]

  subscription-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subscription_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5444:5432"]
    volumes: [subscription-data:/var/lib/postgresql/data]

  # ---------- gRPC Services ----------
  company-service:
    build:
      context: ./services/company-service
    environment:
      GRPC_PORT: "50051"
      DB_HOST: company-db
      DB_NAME: company_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["50051:50051"]
    depends_on: [company-db]
    volumes: ["./protos:/app/protos:ro"]
    command: ["sh", "-c", "node src/migrate.js && node src/index.js"]

  job-service:
    build:
      context: ./services/job-service
    environment:
      GRPC_PORT: "50052"
      DB_HOST: job-db
      DB_NAME: job_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["50052:50052"]
    depends_on: [job-db]
    volumes: ["./protos:/app/protos:ro"]
    command: ["sh", "-c", "node src/migrate.js && node src/index.js"]

  user-service:
    build:
      context: ./services/user-service
    environment:
      GRPC_PORT: "50053"
      DB_HOST: user-db
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: super-secret-jwt-key-change-in-prod
    ports: ["50053:50053"]
    depends_on: [user-db]
    volumes: ["./protos:/app/protos:ro"]
    command: ["sh", "-c", "node src/migrate.js && node src/index.js"]

  subscription-service:
    build:
      context: ./services/subscription-service
    environment:
      GRPC_PORT: "50054"
      DB_HOST: subscription-db
      DB_NAME: subscription_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["50054:50054"]
    depends_on: [subscription-db]
    volumes: ["./protos:/app/protos:ro"]
    command: ["sh", "-c", "node src/migrate.js && node src/index.js"]

  # ---------- GraphQL BFF ----------
  graphql-bff:
    build:
      context: ./graphql-bff
    environment:
      PORT: "4000"
      COMPANY_SERVICE_URL: company-service:50051
      JOB_SERVICE_URL: job-service:50052
      USER_SERVICE_URL: user-service:50053
      SUBSCRIPTION_SERVICE_URL: subscription-service:50054
      JWT_SECRET: super-secret-jwt-key-change-in-prod
    ports: ["4000:4000"]
    depends_on:
      - company-service
      - job-service
      - user-service
      - subscription-service
    volumes: ["./protos:/app/protos:ro"]

  # ---------- React Frontend ----------
  react-fe:
    build:
      context: ./react-fe
    ports: ["3000:80"]
    depends_on: [graphql-bff]

volumes:
  company-data:
  job-data:
  user-data:
  subscription-data:

services:
  # ---------- Database ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5450:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

  # ---------- Message Broker ----------
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream", "--http_port", "8222"]

  # ---------- gRPC Services ----------
  company-service:
    build:
      context: ./services/company-service
    environment:
      GRPC_PORT: "50051"
      NODE_PATH: /app/node_modules
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: company_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports: ["50051:50051"]
    depends_on: [postgres, jaeger]
    volumes:
      - ./protos:/protos:ro
      - ./shared:/shared:ro
    command: ["sh", "-c", "npx tsx src/migrate.ts && npx tsx src/server.ts"]

  job-service:
    build:
      context: ./services/job-service
    environment:
      GRPC_PORT: "50052"
      NODE_PATH: /app/node_modules
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: job_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports: ["50052:50052"]
    depends_on: [postgres, jaeger]
    volumes:
      - ./protos:/protos:ro
      - ./shared:/shared:ro
    command: ["sh", "-c", "npx tsx src/migrate.ts && npx tsx src/server.ts"]

  user-service:
    build:
      context: ./services/user-service
    environment:
      GRPC_PORT: "50053"
      NODE_PATH: /app/node_modules
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: user_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: super-secret-jwt-key-change-in-prod
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports: ["50053:50053"]
    depends_on: [postgres, jaeger]
    volumes:
      - ./protos:/protos:ro
      - ./shared:/shared:ro
    command: ["sh", "-c", "npx tsx src/migrate.ts && npx tsx src/server.ts"]

  subscription-service:
    build:
      context: ./services/subscription-service
    environment:
      GRPC_PORT: "50054"
      NODE_PATH: /app/node_modules
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: subscription_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports: ["50054:50054"]
    depends_on: [postgres, jaeger]
    volumes:
      - ./protos:/protos:ro
      - ./shared:/shared:ro
    command: ["sh", "-c", "npx tsx src/migrate.ts && npx tsx src/server.ts"]

  # ---------- GraphQL BFF ----------
  graphql-bff:
    build:
      context: ./graphql-bff
    environment:
      PORT: "4000"
      NODE_PATH: /app/node_modules
      COMPANY_SERVICE_URL: company-service:50051
      JOB_SERVICE_URL: job-service:50052
      USER_SERVICE_URL: user-service:50053
      SUBSCRIPTION_SERVICE_URL: subscription-service:50054
      JWT_SECRET: super-secret-jwt-key-change-in-prod
      NATS_URL: nats://nats:4222
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports: ["4000:4000"]
    depends_on:
      - company-service
      - job-service
      - user-service
      - subscription-service
      - nats
    volumes:
      - ./protos:/protos:ro
      - ./shared:/shared:ro

  # ---------- Document Service (HTTP) ----------
  document-service:
    build:
      context: ./services/document-service
    environment:
      PORT: "5000"
      NODE_PATH: /app/node_modules
      JWT_SECRET: super-secret-jwt-key-change-in-prod
    ports: ["5001:5000"]
    volumes:
      - ./shared:/shared:ro
      - doc-uploads:/app/uploads

  # ---------- React Frontend ----------
  react-fe:
    build:
      context: ./react-fe
    ports: ["3000:80"]
    depends_on: [graphql-bff, document-service]

  # ---------- Observability ----------
  jaeger:
    image: jaegertracing/all-in-one:1.55
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP receiver
    restart: unless-stopped

volumes:
  pg-data:
  doc-uploads:

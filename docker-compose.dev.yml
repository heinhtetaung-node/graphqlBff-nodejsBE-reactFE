# Dev overrides — run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Adds hot-reload: code changes auto-restart services, no rebuild needed.

services:
  company-service:
    volumes:
      - ./services/company-service/src:/app/src
      - ./protos:/protos:ro
      - ./shared:/shared:ro
    command: ["sh", "-c", "node src/migrate.js && npx nodemon --watch src --watch /shared --watch /protos src/index.js"]

  job-service:
    volumes:
      - ./services/job-service/src:/app/src
      - ./protos:/protos:ro
      - ./shared:/shared:ro
    command: ["sh", "-c", "node src/migrate.js && npx nodemon --watch src --watch /shared --watch /protos src/index.js"]

  user-service:
    volumes:
      - ./services/user-service/src:/app/src
      - ./protos:/protos:ro
      - ./shared:/shared:ro
    command: ["sh", "-c", "node src/migrate.js && npx nodemon --watch src --watch /shared --watch /protos src/index.js"]

  subscription-service:
    volumes:
      - ./services/subscription-service/src:/app/src
      - ./protos:/protos:ro
      - ./shared:/shared:ro
    command: ["sh", "-c", "node src/migrate.js && npx nodemon --watch src --watch /shared --watch /protos src/index.js"]

  graphql-bff:
    volumes:
      - ./graphql-bff/src:/app/src
      - ./protos:/protos:ro
      - ./shared:/shared:ro
    command: ["npx", "nodemon", "--watch", "src", "--watch", "/shared", "src/index.js"]

  react-fe:
    build:
      context: ./react-fe
      dockerfile: Dockerfile.dev
    ports: ["3001:3000"]
    volumes:
      - ./react-fe/src:/app/src
      - ./react-fe/index.html:/app/index.html
    environment:
      VITE_GRAPHQL_URL: http://localhost:4000/graphql

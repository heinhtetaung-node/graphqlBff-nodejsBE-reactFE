# Dev overrides — run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Adds hot-reload: code changes auto-restart services, no rebuild needed.

services:
  company-service:
    volumes:
      - ./services/company-service/src:/app/src
      - ./protos:/protos:ro
      - ./shared:/shared:ro
    command: ["sh", "-c", "npx tsx src/migrate.ts && npx tsx --watch src/server.ts"]

  job-service:
    volumes:
      - ./services/job-service/src:/app/src
      - ./protos:/protos:ro
      - ./shared:/shared:ro
    command: ["sh", "-c", "npx tsx src/migrate.ts && npx tsx --watch src/server.ts"]

  user-service:
    volumes:
      - ./services/user-service/src:/app/src
      - ./protos:/protos:ro
      - ./shared:/shared:ro
    command: ["sh", "-c", "npx tsx src/migrate.ts && npx tsx --watch src/server.ts"]

  subscription-service:
    volumes:
      - ./services/subscription-service/src:/app/src
      - ./protos:/protos:ro
      - ./shared:/shared:ro
    command: ["sh", "-c", "npx tsx src/migrate.ts && npx tsx --watch src/server.ts"]

  graphql-bff:
    volumes:
      - ./graphql-bff/src:/app/src
      - ./protos:/protos:ro
      - ./shared:/shared:ro
    command: ["npx", "tsx", "--watch", "src/server.ts"]

  document-service:
    volumes:
      - ./services/document-service/src:/app/src
      - ./shared:/shared:ro
      - doc-uploads:/app/uploads
    command: ["npx", "tsx", "--watch", "src/server.ts"]

  react-fe:
    build:
      context: ./react-fe
      dockerfile: Dockerfile.dev
    ports: ["3001:3000"]
    volumes:
      - ./react-fe/src:/app/src
      - ./react-fe/index.html:/app/index.html
    environment:
      VITE_GRAPHQL_URL: http://localhost:4000/graphql

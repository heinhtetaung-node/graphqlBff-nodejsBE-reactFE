syntax = "proto3";

package job;

service JobService {
  rpc CreateJob (CreateJobRequest) returns (JobResponse);
  rpc GetJob (GetJobRequest) returns (JobResponse);
  rpc ListJobs (ListJobsRequest) returns (ListJobsResponse);
  rpc UpdateJob (UpdateJobRequest) returns (JobResponse);
  rpc DeleteJob (DeleteJobRequest) returns (DeleteJobResponse);
  rpc ListJobsByCompany (ListJobsByCompanyRequest) returns (ListJobsResponse);
  rpc ApplyToJob (ApplyToJobRequest) returns (ApplicationResponse);
  rpc ListApplicationsByJob (ListApplicationsByJobRequest) returns (ListApplicationsResponse);
  rpc ListApplicationsByUser (ListApplicationsByUserRequest) returns (ListApplicationsResponse);
}

message Job {
  string id = 1;
  string company_id = 2;
  string posted_by_user_id = 3;
  string title = 4;
  string description = 5;
  string location = 6;
  string salary_range = 7;
  string job_type = 8;           // FULL_TIME, PART_TIME, CONTRACT, REMOTE
  string experience_level = 9;   // JUNIOR, MID, SENIOR, LEAD
  repeated string skills = 10;
  bool is_active = 11;
  string created_at = 12;
  string updated_at = 13;
}

message Application {
  string id = 1;
  string job_id = 2;
  string user_id = 3;
  string cover_letter = 4;
  string resume_url = 5;
  string status = 6;  // PENDING, REVIEWED, ACCEPTED, REJECTED
  string created_at = 7;
}

message CreateJobRequest {
  string company_id = 1;
  string posted_by_user_id = 2;
  string title = 3;
  string description = 4;
  string location = 5;
  string salary_range = 6;
  string job_type = 7;
  string experience_level = 8;
  repeated string skills = 9;
}

message GetJobRequest {
  string id = 1;
}

message ListJobsRequest {
  int32 page = 1;
  int32 limit = 2;
  string job_type = 3;
  string experience_level = 4;
  string location = 5;
}

message ListJobsByCompanyRequest {
  string company_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  int32 total = 2;
}

message UpdateJobRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  string location = 4;
  string salary_range = 5;
  string job_type = 6;
  string experience_level = 7;
  repeated string skills = 8;
  bool is_active = 9;
}

message DeleteJobRequest {
  string id = 1;
}

message DeleteJobResponse {
  bool success = 1;
}

message JobResponse {
  Job job = 1;
}

message ApplyToJobRequest {
  string job_id = 1;
  string user_id = 2;
  string cover_letter = 3;
  string resume_url = 4;
}

message ApplicationResponse {
  Application application = 1;
}

message ListApplicationsByJobRequest {
  string job_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ListApplicationsByUserRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message ListApplicationsResponse {
  repeated Application applications = 1;
  int32 total = 2;
}

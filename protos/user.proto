syntax = "proto3";

package user;

service UserService {
  rpc CreateUser (CreateUserRequest) returns (UserResponse);
  rpc GetUser (GetUserRequest) returns (UserResponse);
  rpc GetUserByEmail (GetUserByEmailRequest) returns (UserResponse);
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UserResponse);
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string role = 4;          // TALENT_HUNTER, JOB_HUNTER
  string phone = 5;
  string avatar_url = 6;
  string bio = 7;
  string company_id = 8;    // only for TALENT_HUNTER
  repeated string skills = 9;  // only for JOB_HUNTER
  string resume_url = 10;      // only for JOB_HUNTER
  string created_at = 11;
  string updated_at = 12;
}

message CreateUserRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string role = 4;
  string phone = 5;
  string bio = 6;
  string company_id = 7;
  repeated string skills = 8;
}

message GetUserRequest {
  string id = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message ListUsersRequest {
  int32 page = 1;
  int32 limit = 2;
  string role = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

message UpdateUserRequest {
  string id = 1;
  string name = 2;
  string phone = 3;
  string avatar_url = 4;
  string bio = 5;
  string company_id = 6;
  repeated string skills = 7;
  string resume_url = 8;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message UserResponse {
  User user = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  User user = 2;
}
